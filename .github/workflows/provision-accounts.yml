name: Provision isolated account database
on:
  workflow_dispatch:
    inputs:
      target:
        description: Account database environment
        required: true
        type: choice
        options: [preview, production]
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create or find account D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_TARGET: ${{ inputs.target }}
        run: node scripts/provision-accounts.mjs "$ACCOUNT_TARGET" >> "$GITHUB_STEP_SUMMARY"
